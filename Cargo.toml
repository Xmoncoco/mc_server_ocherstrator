[package]
name = "mcserv"
version = "0.1.0"
edition = "2024"

[dependencies]
portable-pty = "0.9.0"
reqwest = {version = "0.13.4", features =["json"]}
rocket = { version = "0.5.1", features = ["json"] }
tokio = {version = "1.53.1", features = ["full"]}
nix = { version = "0.30", features = ["term", "fs", "process", "ioctl"] }
libc = "0.2"
uuid = {version = "1.26.0", features =["v4"]}
serde = "1.0.229"
toml = "1.1.5"
argon2 = { version = "0.5", features = ["std"] }
ed25519-dalek = "3.0.0"
base64 = "0.23.1"
rocket_ws = "0.1.1"
